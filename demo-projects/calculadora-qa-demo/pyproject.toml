[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calculadora-qa-demo"
version = "0.1.0"
description = "Calculadora modular usada como proyecto de prueba para el agente QA."
requires-python = ">=3.11"
dependencies = ["streamlit"]

[tool.setuptools.packages.find]
include = ["calculadora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
