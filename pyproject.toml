[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-engineering-team"
version = "0.1.0"
description = "Local-first hierarchical software-engineering agent team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "langgraph>=0.2,<2",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "mcp>=2.1,<3",
]

[project.optional-dependencies]
rag = [
  "chromadb>=0.5",
  "langchain-core>=1.2,<2",
  "langchain-text-splitters>=1.1,<2",
  "sentence-transformers>=3.0",
]
observability = ["langfuse>=4.0,<5"]
sample-app = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
engineering-team = "engineering_team.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_team"]
